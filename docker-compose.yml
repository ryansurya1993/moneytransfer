x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-moneytransfer}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moneytransfer}
  POSTGRES_DB: ${POSTGRES_DB:-moneytransfer}

x-database-url: &database-url postgres://${POSTGRES_USER:-moneytransfer}:${POSTGRES_PASSWORD:-moneytransfer}@postgres:5432/${POSTGRES_DB:-moneytransfer}?sslmode=disable

services:
  postgres:
    image: postgres:18.7-alpine
    environment: *db-env
    volumes:
      # Postgres 18 images keep data under a version subdirectory of this path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Over TCP: on first start the image runs a temporary server for its init step that listens only
      # on the Unix socket, so a socket check would pass before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-moneytransfer}:${POSTGRES_PASSWORD:-moneytransfer}@postgres:5432/${POSTGRES_DB:-moneytransfer}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: postgres:18.7-alpine
    environment:
      <<: *db-env
      PGPASSWORD: ${POSTGRES_PASSWORD:-moneytransfer}
    volumes:
      - ./deploy/seed/seed.sql:/seed.sql:ro
    command:
      - psql
      - --host=postgres
      - --username=${POSTGRES_USER:-moneytransfer}
      - --dbname=${POSTGRES_DB:-moneytransfer}
      - --set=ON_ERROR_STOP=1
      - --set=initial_balance=${INITIAL_BALANCE:-1000000000}
      - --file=/seed.sql
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    command: ["/usr/local/bin/api"]
    environment:
      DATABASE_URL: *database-url
      # Unset variables arrive empty, and the api falls back to its own defaults.
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-}
      DB_IDLE_IN_TRANSACTION_TIMEOUT: ${DB_IDLE_IN_TRANSACTION_TIMEOUT:-}
      DB_TIMEOUT: ${DB_TIMEOUT:-}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-}
      MAX_TRANSFER_AMOUNT: ${MAX_TRANSFER_AMOUNT:-}
      MERCHANT_ID: ${MERCHANT_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
    # Two replicas show that the balance guard holds across processes.
    deploy:
      replicas: 2
    healthcheck:
      # The distroless image has no curl, so the binary probes itself.
      test: ["CMD", "/usr/local/bin/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    # Longer than HTTP_SHUTDOWN_TIMEOUT, so in-flight requests can finish before Docker kills the process.
    stop_grace_period: 15s

  # The only way into the api from the host. Spreads requests over the api replicas.
  haproxy:
    image: haproxy:3.4.7-alpine
    ports:
      - "${API_PORT:-18080}:8080"
    volumes:
      - ./deploy/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      # Healthy once HAProxy can reach at least one api replica.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    # RabbitMQ keeps its data under the node name, which comes from the hostname.
    # A fixed hostname keeps the queues when the container is recreated.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-moneytransfer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-moneytransfer}
    ports:
      - "${RABBITMQ_UI_PORT:-18672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  relay:
    build: .
    command: ["/usr/local/bin/relay"]
    environment:
      DATABASE_URL: *database-url
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-moneytransfer}:${RABBITMQ_PASSWORD:-moneytransfer}@rabbitmq:5672/
      DB_IDLE_IN_TRANSACTION_TIMEOUT: ${DB_IDLE_IN_TRANSACTION_TIMEOUT:-}
      RELAY_POLL_INTERVAL: ${RELAY_POLL_INTERVAL:-}
      RELAY_BATCH_SIZE: ${RELAY_BATCH_SIZE:-}
      RELAY_PUBLISH_TIMEOUT: ${RELAY_PUBLISH_TIMEOUT:-}
      RELAY_STALL_TIMEOUT: ${RELAY_STALL_TIMEOUT:-}
      OUTBOX_ALERT_AGE: ${OUTBOX_ALERT_AGE:-}
      QUEUE_DELIVERY_LIMIT: ${QUEUE_DELIVERY_LIMIT:-}
      RECONCILE_AFTER: ${RECONCILE_AFTER:-}
      RECONCILE_MAX_ATTEMPTS: ${RECONCILE_MAX_ATTEMPTS:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
    depends_on:
      seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  worker:
    build: .
    command: ["/usr/local/bin/worker"]
    environment:
      DATABASE_URL: *database-url
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-moneytransfer}:${RABBITMQ_PASSWORD:-moneytransfer}@rabbitmq:5672/
      PROVIDER_URL: http://mockprovider:8080
      DB_IDLE_IN_TRANSACTION_TIMEOUT: ${DB_IDLE_IN_TRANSACTION_TIMEOUT:-}
      DB_TIMEOUT: ${DB_TIMEOUT:-}
      QUEUE_DELIVERY_LIMIT: ${QUEUE_DELIVERY_LIMIT:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
      WORKER_SHUTDOWN_TIMEOUT: ${WORKER_SHUTDOWN_TIMEOUT:-}
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-}
      PROVIDER_MAX_ATTEMPTS: ${PROVIDER_MAX_ATTEMPTS:-}
      PROVIDER_BACKOFF_BASE: ${PROVIDER_BACKOFF_BASE:-}
      PROVIDER_BACKOFF_MAX: ${PROVIDER_BACKOFF_MAX:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
    depends_on:
      seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mockprovider:
        condition: service_started
    restart: unless-stopped
    # Longer than WORKER_SHUTDOWN_TIMEOUT, so payouts in progress can finish.
    stop_grace_period: 30s

  # Fake payout provider, reachable only inside the compose network at http://mockprovider:8080.
  mockprovider:
    build: .
    command: ["/usr/local/bin/mockprovider"]
    environment:
      MOCK_MIN_DELAY: ${MOCK_MIN_DELAY:-}
      MOCK_MAX_DELAY: ${MOCK_MAX_DELAY:-}
      MOCK_FAILURE_PERCENT: ${MOCK_FAILURE_PERCENT:-}
      MOCK_TIMEOUT_PERCENT: ${MOCK_TIMEOUT_PERCENT:-}
      MOCK_UNAVAILABLE_PERCENT: ${MOCK_UNAVAILABLE_PERCENT:-}
      MOCK_HANG_DURATION: ${MOCK_HANG_DURATION:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
    restart: unless-stopped
    stop_grace_period: 15s

  # Not started by `docker compose up`; run it with `docker compose run --rm loadtest`,
  # or `docker compose run --rm loadtest topup 1000000000` to add money to the balance.
  # After `--scale worker=N`, add --no-deps, or `run` puts the worker count back to 1.
  loadtest:
    build: .
    # An entrypoint, not a command, so `run loadtest topup <amount>` passes arguments to the binary.
    entrypoint: ["/usr/local/bin/loadtest"]
    profiles: ["loadtest"]
    environment:
      DATABASE_URL: *database-url
      LOADTEST_TARGET_URL: ${LOADTEST_TARGET_URL:-}
      LOADTEST_PROVIDER_URL: ${LOADTEST_PROVIDER_URL:-}
      LOADTEST_RATE: ${LOADTEST_RATE:-}
      LOADTEST_DURATION: ${LOADTEST_DURATION:-}
      LOADTEST_CONCURRENCY: ${LOADTEST_CONCURRENCY:-}
      LOADTEST_DUPLICATE_PERCENT: ${LOADTEST_DUPLICATE_PERCENT:-}
      LOADTEST_MAGIC_PERCENT: ${LOADTEST_MAGIC_PERCENT:-}
      LOADTEST_REQUEST_TIMEOUT: ${LOADTEST_REQUEST_TIMEOUT:-}
      LOADTEST_DRAIN_TIMEOUT: ${LOADTEST_DRAIN_TIMEOUT:-}
      LOADTEST_MIN_AMOUNT: ${LOADTEST_MIN_AMOUNT:-}
      LOADTEST_MAX_AMOUNT: ${LOADTEST_MAX_AMOUNT:-}
      MERCHANT_ID: ${MERCHANT_ID:-}
    depends_on:
      haproxy:
        condition: service_healthy
      relay:
        condition: service_started
      worker:
        condition: service_started
      mockprovider:
        condition: service_started

volumes:
  pgdata:
  rabbitmqdata:
