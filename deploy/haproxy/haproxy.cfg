global
    log stdout format raw local0

defaults
    mode http
    log global
    # A stopped replica never answers the connect; this bounds the wait before trying another one.
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    # Only a failed connection is retried (retry-on defaults to conn-failure): the request never
    # reached a replica, so a POST is not submitted twice. Each retry goes to another replica.
    retries 2
    option redispatch 1

# Docker's DNS, read from /etc/resolv.conf. New or recreated api containers are picked up
# without restarting HAProxy.
resolvers docker
    parse-resolv-conf

frontend http
    bind :8080
    default_backend api

    capture response header X-Correlation-ID len 64
    # correlation_id is the one the api answered with, so it matches the api's log lines.
    log-format "%{+json}o %(time)[date,utime(%Y-%m-%dT%H:%M:%SZ)] %(method)HM %(path)HPO %(status)ST %(duration_ms)Ta %(server)s %(retries)rc %(termination)tsc %(correlation_id)[capture.res.hdr(0)]"

    # Same rule as the api's own log: a successful health probe is not news.
    http-request set-var(txn.probe) bool(true) if { path /healthz }
    http-response set-log-level silent if { var(txn.probe) -m bool } { status 200 }

    # Errors HAProxy answers itself get the api's problem format. The api's own errors pass through.
    http-error status 502 content-type application/problem+json hdr Cache-Control no-store string '{"type":"about:blank","title":"Bad Gateway","status":502,"detail":"The service did not answer properly. Retry the request later.","code":"BAD_GATEWAY"}'
    http-error status 503 content-type application/problem+json hdr Cache-Control no-store hdr Retry-After 1 string '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"The service is temporarily unavailable. Retry the request later.","code":"SERVICE_UNAVAILABLE"}'
    http-error status 504 content-type application/problem+json hdr Cache-Control no-store string '{"type":"about:blank","title":"Gateway Timeout","status":504,"detail":"The service did not answer in time. Retry the request later.","code":"GATEWAY_TIMEOUT"}'

backend api
    balance roundrobin
    # Active check every second: a replica that stops answering leaves the rotation before most
    # requests reach it.
    option httpchk GET /healthz
    # Up to 4 api replicas (docker compose up --scale api=4).
    server-template api 4 api:8080 check inter 1s fall 1 rise 2 resolvers docker init-addr none
